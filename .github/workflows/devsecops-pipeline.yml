name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE: secureflow
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # Week 1: Static Application Security Testing (SAST)
  sast-scan:
    name: SAST - Code Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint SAST
        run: |
          npm run lint || true
          echo "✅ ESLint scan completed"

      - name: SonarQube Scan (SAST)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # Week 2: Software Composition Analysis (SCA) - Dependency Scanning
  sca-scan:
    name: SCA - Dependency Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SecureFlow'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --scan .
        continue-on-error: true

      - name: Upload OWASP Dependency Check results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
        if: always()

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high
        continue-on-error: true

  # Week 2: Container Security Scanning
  container-scan:
    name: Container Security - Docker Image Scan
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://postgres:ci_test_only@localhost:5432/app_db

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

      - name: Trivy scan report (human-readable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Docker Scout CVE Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          only-severities: critical,high
          exit-code: false
        continue-on-error: true

  # Week 3: Infrastructure as Code (IaC) Security Scanning
  iac-scan:
    name: IaC Security - Terraform Configuration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov IaC scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results.sarif
        if: always()

      - name: Run TFSec scanner
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          format: sarif
          soft_fail: true

      - name: TFSec detailed scan
        run: |
          docker run --rm -v $(pwd)/terraform:/src aquasec/tfsec:latest /src --format=json > tfsec-report.json || true
          echo "✅ TFSec scan completed"

      - name: Upload TFSec report
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: tfsec-report.json
        if: always()

      - name: Terraform fmt check
        run: |
          cd terraform
          docker run --rm -v $(pwd):/workspace hashicorp/terraform:latest fmt -check -recursive || true

      - name: Terraform validate
        run: |
          cd terraform
          docker run --rm -v $(pwd):/workspace hashicorp/terraform:latest init -backend=false
          docker run --rm -v $(pwd):/workspace hashicorp/terraform:latest validate

  # Build and Test
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_test_only' }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME || 'app_db' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_DB_USER || 'postgres' }}:${{ secrets.CI_DB_PASSWORD || 'ci_test_only' }}@localhost:5432/${{ secrets.CI_DB_NAME || 'app_db' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # Week 4: Dynamic Application Security Testing (DAST)
  dast-scan:
    name: DAST - Runtime Security Testing
    runs-on: ubuntu-latest
    needs: [build-and-test, container-scan]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_test_only' }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME || 'app_db' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start application
        run: |
          npm run build
          npm start &
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1
        env:
          DATABASE_URL: postgresql://${{ secrets.CI_DB_USER || 'postgres' }}:${{ secrets.CI_DB_PASSWORD || 'ci_test_only' }}@localhost:5432/${{ secrets.CI_DB_NAME || 'app_db' }}
          PORT: 3000

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
        continue-on-error: true

      - name: Upload ZAP scan results
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report_json.json
        if: always()

  # Security Summary Report
  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan, container-scan, iac-scan, dast-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate security summary
        run: |
          echo "# 🔒 DevSecOps Security Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Execution: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Scans Performed" >> $GITHUB_STEP_SUMMARY
          echo "✅ SAST - Static Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "✅ SCA - Software Composition Analysis" >> $GITHUB_STEP_SUMMARY
          echo "✅ Container Scanning - Docker Image Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "✅ IaC Security - Terraform Configuration Analysis" >> $GITHUB_STEP_SUMMARY
          echo "✅ DAST - Dynamic Application Security Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "Detailed reports are available in the artifacts section." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review security findings in GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Check artifact reports for detailed vulnerability information" >> $GITHUB_STEP_SUMMARY
          echo "3. Prioritize and remediate critical and high severity issues" >> $GITHUB_STEP_SUMMARY
          echo "4. Update dependencies and base images regularly" >> $GITHUB_STEP_SUMMARY

      - name: Create security badge
        run: |
          echo "[![DevSecOps Pipeline](https://img.shields.io/badge/DevSecOps-Enabled-green)](https://github.com/${{ github.repository }}/actions)" > security-badge.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-badge.md
